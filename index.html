<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 名古屋亞運會 · 賽程追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">愛知・名古屋</span>
      <h1>2026 亞運會賽程追蹤<span class="brand-en">20th Asian Games Aichi–Nagoya</span></h1>
    </div>
    <div class="games-dates">Sep 19 – Oct 4, 2026</div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="calendar" role="tab">01 · 日程時間表</button>
    <button class="tab-btn" data-tab="map" role="tab">02 · 場館地圖</button>
    <button class="tab-btn" data-tab="table" role="tab">03 · 全部項目</button>
  </nav>
</header>

<main>

  <!-- TAB 1: CALENDAR / GANTT TIMELINE -->
  <section id="tab-calendar" class="tab-panel active">
    <div class="panel-controls">
      <div class="search-wrap">
        <input type="text" id="cal-search" placeholder="搜尋項目 / 場館...">
      </div>
      <label class="hkg-toggle">
        <input type="checkbox" id="cal-hkg-only">
        <span class="hkg-chip">只顯示香港代表隊項目</span>
      </label>
    </div>

    <div class="view-toggle">
      <button class="view-btn active" data-view="timeline">時間表 Timeline</button>
      <button class="view-btn" data-view="daily">每日賽事 Daily</button>
    </div>

    <div class="day-ribbon" id="day-ribbon"></div>

    <div id="timeline-view" class="cal-view active">
      <div class="gantt-wrap">
        <div class="gantt" id="gantt"></div>
      </div>
      <p class="hint">每一列代表一項運動；色塊長度顯示比賽日數（開始至結束日期）。點擊色塊查看詳情，或點擊上方日期跳至該天。紅框 = 香港代表隊參與項目。</p>
    </div>

    <div id="daily-view" class="cal-view">
      <div class="daily-header">
        <button class="day-nav" id="day-prev" aria-label="前一天">‹</button>
        <div class="daily-date" id="daily-date-label"></div>
        <button class="day-nav" id="day-next" aria-label="後一天">›</button>
      </div>
      <div class="daily-list" id="daily-list"></div>
    </div>
  </section>

  <!-- TAB 2: LIST + MAP -->
  <section id="tab-map" class="tab-panel">
    <div class="panel-controls">
      <div class="search-wrap">
        <input type="text" id="map-search" placeholder="搜尋項目 / 場館...">
      </div>
      <label class="hkg-toggle">
        <input type="checkbox" id="map-hkg-only">
        <span class="hkg-chip">只顯示香港代表隊項目</span>
      </label>
    </div>
    <div class="map-layout">
      <div class="venue-list" id="venue-list"></div>
      <div class="map-panel">
        <iframe id="map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps?q=%E5%90%8D%E5%8F%A4%E5%B1%8B%E5%B8%82%E7%91%9E%E7%A9%82%E5%85%AC%E5%9C%92%E9%99%B8%E4%B8%8A%E7%AB%B6%E6%8A%80%E5%A0%B4&output=embed"></iframe>
        <a id="map-external-link" class="map-external" href="#" target="_blank" rel="noopener">在 Google 地圖開啟 ↗</a>
      </div>
    </div>
  </section>

  <!-- TAB 3: SORTABLE TABLE -->
  <section id="tab-table" class="tab-panel">
    <div class="panel-controls">
      <div class="search-wrap">
        <input type="text" id="table-search" placeholder="搜尋項目 / 場館...">
      </div>
      <label class="hkg-toggle">
        <input type="checkbox" id="table-hkg-only">
        <span class="hkg-chip">只顯示香港代表隊項目</span>
      </label>
    </div>
    <div class="table-wrap">
      <table id="events-table">
        <thead>
          <tr>
            <th data-sort="start">日期 <span class="sort-ind"></span></th>
            <th data-sort="sport">運動項目 <span class="sort-ind"></span></th>
            <th data-sort="event">分項</th>
            <th data-sort="venue">場館</th>
            <th data-sort="hkg">香港代表隊 <span class="sort-ind"></span></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <p class="hint" id="unscheduled-note"></p>
  </section>

</main>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
